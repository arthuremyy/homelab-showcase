# nginx-dashboard — deux serveurs, deux périmètres :
#   :80   PUBLIC  (cloudflared → example.com) : page de connexion uniquement
#   :8082 VPN     (nginx-proxy-local → dashboard. / monitoring. / capital.example.com) : tout
# Le port 8082 n'est déclaré dans aucune route cloudflared : il n'est joignable que
# depuis le réseau Docker, donc via Tailscale. Ne jamais l'ajouter au tunnel.

# Page servie à la racine selon le sous-domaine VPN
map $host $sf_vpn_page {
    ~^dashboard\. /index.html;
    ~^capital\.  /capital.html;
    default      /monitoring.html;
}

# ═══════════════════════════════ PUBLIC ═══════════════════════════════════
# Noms des conteneurs résolus à chaque requête (voir nginx-proxy/conf.d/00-resolver.conf)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # V08 — headers anti-clickjacking (sans HSTS : Cloudflare gère déjà)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Déterminer le vrai schéma (https via Cloudflare)
    set $real_scheme $scheme;
    if ($http_x_forwarded_proto) {
        set $real_scheme $http_x_forwarded_proto;
    }

    # Subrequest interne : vérifie le cookie auth_token via le backend
    location = /_auth {
        internal;
        set $up_auth http://dashboard-api:8000/api/auth/check;
        proxy_pass $up_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Seule API publique : l'authentification. Métriques et Capital sont VPN.
    location /api/auth/ {
        set $up_api http://dashboard-api:8000;      # URI transmise telle quelle
        proxy_pass $up_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
    location /api/ {
        return 404;
    }

    # Monitoring et Capital : Tailscale uniquement
    location ~ ^/(monitoring|capital)(\.html)?$ {
        return 301 https://$1.example.com/;
    }
    location ^~ /assets/js/capital/          { return 404; }
    location = /assets/js/monitoring.js      { return 404; }
    location ~ ^/assets/css/(capital|monitoring)\.css$ { return 404; }
    location ^~ /data/                       { return 404; }

    # Racine : l'accueil est VPN (dashboard.), Capital aussi (invest. → capital.)
    location = / {
        if ($http_host ~* "^invest\.") {
            return 302 https://capital.example.com/;
        }
        return 302 https://dashboard.example.com/;
    }
    location = /index.html {
        return 301 https://dashboard.example.com/;
    }

    # Page de login - publique (pas d'auth)
    location = /login.html {
        expires -1;
        try_files $uri =404;
    }

    # Assets - publics (CSS/JS nécessaires pour login.html)
    location /assets/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Rien d'autre n'est public
    location / {
        return 404;
    }

    error_page 404 /login.html;
}

# ═════════════════════════ VPN (via nginx-proxy-local) ════════════════════
server {
    listen 8082;
    server_name dashboard.example.com monitoring.example.com capital.example.com;
    root /usr/share/nginx/html;

    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location = /_auth {
        internal;
        set $up_auth http://dashboard-api:8000/api/auth/check;
        proxy_pass $up_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Proxy vers Capital Control API (préfixe plus long → priorité sur /api/)
    location /api/capital/ {
        auth_request /_auth;
        error_page 401 = @login_redirect;
        set $up_capital http://capital-control:8100;
        rewrite ^/api/capital/(.*)$ /$1 break;   # après le set : break arrête les directives suivantes
        proxy_pass $up_capital;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;   # génération du briefing IA > 60 s
        proxy_buffering off;
    }

    # API du tableau de bord (métriques, conteneurs, speedtest, auth)
    location /api/ {
        set $up_api http://dashboard-api:8000;      # URI transmise telle quelle
        proxy_pass $up_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # dashboard. → accueil, monitoring. → Monitoring, capital. → Capital
    location = / {
        auth_request /_auth;
        error_page 401 = @login_redirect;
        expires -1;
        try_files $sf_vpn_page =404;
    }
    location ~ ^/(monitoring|capital)(\.html)?$ {
        return 301 https://$1.example.com/;
    }
    location = /index.html {
        return 301 https://dashboard.example.com/;
    }

    location = /login.html {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ^~ /data/ { return 404; }

    location / {
        auth_request /_auth;
        error_page 401 = @login_redirect;
        try_files $uri =404;
    }

    location @login_redirect {
        return 302 https://example.com/login.html?redirect=https://$host$request_uri;
    }
}
