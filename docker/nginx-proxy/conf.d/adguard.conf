server {
    listen 80;
    server_name adguard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name adguard.example.com;

    ssl_certificate     /etc/nginx/certs/homelab.crt;
    ssl_certificate_key /etc/nginx/certs/homelab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /_auth {
        internal;
        set $up_auth http://dashboard-api:8000/api/auth/check;
        proxy_pass $up_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    error_page 401 = @login_redirect;
    location @login_redirect {
        return 302 https://example.com/login.html?redirect=$scheme://$host$request_uri;
    }

    location / {
        auth_request /_auth;

        set $up_adguard http://adguard:3000;
        proxy_pass $up_adguard;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
