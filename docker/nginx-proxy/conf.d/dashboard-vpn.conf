# Accueil, Monitoring et Capital — Tailscale uniquement (servis par nginx-dashboard:8082,
# port absent du tunnel Cloudflare). L'auth sfauth est vérifiée par nginx-dashboard.
server {
    listen 80;
    server_name dashboard.example.com monitoring.example.com capital.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dashboard.example.com monitoring.example.com capital.example.com;

    ssl_certificate     /etc/nginx/certs/homelab.crt;
    ssl_certificate_key /etc/nginx/certs/homelab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        set $up_nginx_dashboard http://nginx-dashboard:8082;
        proxy_pass $up_nginx_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Écrasés : le client ne doit pas pouvoir choisir son IP (limite de connexion)
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
        proxy_read_timeout 190s;   # briefing IA de Capital
        proxy_buffering off;
    }
}
