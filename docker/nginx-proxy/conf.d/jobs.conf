server {
    listen 80;
    server_name jobs.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jobs.example.com;

    ssl_certificate     /etc/nginx/certs/homelab.crt;
    ssl_certificate_key /etc/nginx/certs/homelab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Healthcheck — sans auth, pour les sondes
    location = /api/jobs/health {
        set $up_job_radar http://job-radar:8400;
        proxy_pass $up_job_radar;
    }

    # JWT auth pour tout le reste (UI + API)
    location = /_auth {
        internal;
        set $up_auth http://dashboard-api:8000/api/auth/check;
        proxy_pass $up_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    error_page 401 = @login_redirect;
    location @login_redirect {
        return 302 https://example.com/login.html?redirect=$scheme://$host$request_uri;
    }

    location / {
        auth_request /_auth;
        set $up_job_radar http://job-radar:8400;
        proxy_pass $up_job_radar;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        # La collecte manuelle rend la main tout de suite (BackgroundTasks),
        # mais on laisse de la marge pour les requêtes de liste sur gros volume.
        proxy_read_timeout 120s;
    }
}
